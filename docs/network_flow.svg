<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" role="img"
     aria-label="Network flow. The machine writes to exactly two testnet rollups and reads from six chains. Each rollup posts its own batches and proofs to its L1, and reading that public evidence is how settlement times are obtained. Mainnet chains are observed only and refuse writes."
     font-family="Helvetica, Arial, sans-serif" fill="currentColor">
  <defs>
    <marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker>
    <marker id="n2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
  </defs>

  <!-- the machine -->
  <rect x="16" y="56" width="140" height="404" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="86" y="240" font-size="13" text-anchor="middle">this machine</text>
  <text x="86" y="262" font-size="10" text-anchor="middle" opacity="0.6">one key</text>
  <text x="86" y="277" font-size="10" text-anchor="middle" opacity="0.6">one region</text>
  <text x="86" y="292" font-size="10" text-anchor="middle" opacity="0.6">no hosted node</text>

  <!-- band labels -->
  <text x="290" y="42" font-size="9.5" letter-spacing="1.5" opacity="0.55">TESTNET — THE ONLY CHAINS WE WRITE TO</text>
  <text x="290" y="286" font-size="9.5" letter-spacing="1.5" opacity="0.55">MAINNET — OBSERVED ONLY</text>

  <!-- testnet L2s -->
  <rect x="290" y="56" width="190" height="54" rx="4" fill="none" stroke="#c2410c" stroke-width="1.8"/>
  <text x="385" y="78" font-size="12" text-anchor="middle" fill="#c2410c">zkSync Era Sepolia</text>
  <text x="385" y="95" font-size="9.5" text-anchor="middle" fill="#c2410c" opacity="0.8">chain 300</text>

  <rect x="290" y="146" width="190" height="54" rx="4" fill="none" stroke="#c2410c" stroke-width="1.8"/>
  <text x="385" y="168" font-size="12" text-anchor="middle" fill="#c2410c">OP Sepolia</text>
  <text x="385" y="185" font-size="9.5" text-anchor="middle" fill="#c2410c" opacity="0.8">chain 11155420</text>

  <!-- mainnet L2s -->
  <rect x="290" y="300" width="190" height="50" rx="4" fill="none" stroke="currentColor"
        stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="385" y="320" font-size="12" text-anchor="middle">zkSync Era Mainnet</text>
  <text x="385" y="336" font-size="9.5" text-anchor="middle" opacity="0.6">chain 324</text>

  <rect x="290" y="386" width="190" height="50" rx="4" fill="none" stroke="currentColor"
        stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="385" y="406" font-size="12" text-anchor="middle">OP Mainnet</text>
  <text x="385" y="422" font-size="9.5" text-anchor="middle" opacity="0.6">chain 10</text>

  <!-- L1s -->
  <rect x="700" y="84" width="200" height="54" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="800" y="106" font-size="12" text-anchor="middle">Ethereum Sepolia</text>
  <text x="800" y="123" font-size="9.5" text-anchor="middle" opacity="0.6">chain 11155111</text>

  <rect x="700" y="336" width="200" height="50" rx="4" fill="none" stroke="currentColor"
        stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="800" y="356" font-size="12" text-anchor="middle">Ethereum Mainnet</text>
  <text x="800" y="372" font-size="9.5" text-anchor="middle" opacity="0.6">chain 1</text>

  <!-- writes -->
  <line x1="156" y1="72" x2="284" y2="72" stroke="#c2410c" stroke-width="2" marker-end="url(#n2)"/>
  <line x1="156" y1="162" x2="284" y2="162" stroke="#c2410c" stroke-width="2" marker-end="url(#n2)"/>
  <text x="220" y="66" font-size="10" text-anchor="middle" fill="#c2410c">submit</text>
  <text x="220" y="156" font-size="10" text-anchor="middle" fill="#c2410c">submit</text>

  <!-- reads back from the L2s -->
  <line x1="284" y1="96" x2="162" y2="96" stroke="currentColor" stroke-width="1.2" marker-end="url(#n1)"/>
  <line x1="284" y1="186" x2="162" y2="186" stroke="currentColor" stroke-width="1.2" marker-end="url(#n1)"/>
  <text x="223" y="112" font-size="9.5" text-anchor="middle" opacity="0.75">receipt · t1</text>
  <text x="223" y="202" font-size="9.5" text-anchor="middle" opacity="0.75">receipt · t1</text>

  <!-- settlement : each rollup posts to its own L1 -->
  <path d="M 480 78 L 590 78 L 590 100 L 694 100" fill="none" stroke="currentColor"
        stroke-width="1.7" marker-end="url(#n1)"/>
  <path d="M 480 172 L 610 172 L 610 124 L 694 124" fill="none" stroke="currentColor"
        stroke-width="1.7" marker-end="url(#n1)"/>
  <text x="800" y="52" font-size="10.5" text-anchor="middle">each rollup posts its own batches</text>
  <text x="800" y="66" font-size="10.5" text-anchor="middle">and proofs to its L1, publicly</text>
  <text x="590" y="200" font-size="10" text-anchor="middle" opacity="0.7">we read that evidence — we never produce it</text>

  <!-- read the L1 : this is where t2 and t3 come from -->
  <path d="M 800 138 L 800 244 L 162 244" fill="none" stroke="#c2410c" stroke-width="1.7"
        marker-end="url(#n2)"/>
  <text x="480" y="238" font-size="10.5" text-anchor="middle" fill="#c2410c">batch and proof block timestamps — this is t2 and t3</text>

  <!-- mainnet reads -->
  <line x1="284" y1="325" x2="162" y2="325" stroke="currentColor" stroke-width="1.2"
        marker-end="url(#n1)" opacity="0.65"/>
  <line x1="284" y1="411" x2="162" y2="411" stroke="currentColor" stroke-width="1.2"
        marker-end="url(#n1)" opacity="0.65"/>
  <path d="M 800 386 L 800 452 L 162 452" fill="none" stroke="currentColor" stroke-width="1.2"
        marker-end="url(#n1)" opacity="0.65"/>
  <text x="480" y="446" font-size="10" text-anchor="middle" opacity="0.7">production cadence · proof interval · challenge period</text>

  <path d="M 480 322 L 600 322 L 600 350 L 694 350" fill="none" stroke="currentColor"
        stroke-width="1.3" marker-end="url(#n1)" opacity="0.65"/>
  <path d="M 480 408 L 620 408 L 620 372 L 694 372" fill="none" stroke="currentColor"
        stroke-width="1.3" marker-end="url(#n1)" opacity="0.65"/>

  <text x="290" y="500" font-size="10" opacity="0.75">Every mainnet entry carries readonly: true. Any attempt to sign against one is refused</text>
  <text x="290" y="514" font-size="10" opacity="0.75">before a connection is opened — the repository holds a funded key.</text>

  <!-- legend -->
  <line x1="700" y1="496" x2="736" y2="496" stroke="#c2410c" stroke-width="2"/>
  <text x="744" y="500" font-size="10" fill="#c2410c">writes, and t2/t3</text>
  <line x1="700" y1="516" x2="736" y2="516" stroke="currentColor" stroke-width="1.2"/>
  <text x="744" y="520" font-size="10" opacity="0.75">reads</text>
</svg>
