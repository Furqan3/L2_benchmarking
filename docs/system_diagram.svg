<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img"
     aria-label="Submission and resolution are two separate programs joined only by a JSON Lines file. The submit pass sends transactions to the L2 and records t0 and t1 in minutes, then exits. The resolve pass runs hourly for days, reading Ethereum through a per-rollup adapter to fill in t2 and t3."
     font-family="Helvetica, Arial, sans-serif" fill="currentColor">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- band labels -->
  <text x="12" y="42" font-size="9.5" letter-spacing="1.6" opacity="0.55">SUBMIT PASS · MINUTES, THEN EXITS</text>
  <text x="12" y="322" font-size="9.5" letter-spacing="1.6" opacity="0.55">RESOLVE PASS · HOURLY, FOR DAYS</text>

  <!-- ROW A : submit -->
  <rect x="20" y="58" width="130" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="85" y="80" font-size="12.5" text-anchor="middle">configs/</text>
  <text x="85" y="96" font-size="10" text-anchor="middle" opacity="0.6">*.yaml</text>

  <rect x="215" y="58" width="160" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="295" y="80" font-size="12.5" text-anchor="middle">submit_run</text>
  <text x="295" y="96" font-size="10" text-anchor="middle" opacity="0.6">sign · broadcast · poll</text>

  <rect x="440" y="58" width="160" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="520" y="80" font-size="12.5" text-anchor="middle">L2 sequencer</text>
  <text x="520" y="96" font-size="10" text-anchor="middle" opacity="0.6">zkSync · OP</text>

  <line x1="150" y1="83" x2="209" y2="83" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="179" y="76" font-size="10" text-anchor="middle" opacity="0.75">what to run</text>

  <line x1="375" y1="74" x2="434" y2="74" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="404" y="66" font-size="10" text-anchor="middle" opacity="0.75">send · t0</text>
  <line x1="440" y1="96" x2="381" y2="96" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="410" y="110" font-size="10" text-anchor="middle" opacity="0.75">receipt · t1</text>

  <!-- ROW B : the file -->
  <rect x="215" y="196" width="385" height="62" rx="4" fill="none" stroke="#c2410c" stroke-width="2"/>
  <text x="407" y="222" font-size="13.5" text-anchor="middle" fill="#c2410c">results/&lt;run_id&gt;.jsonl</text>
  <text x="407" y="240" font-size="10.5" text-anchor="middle" fill="#c2410c" opacity="0.85">one row per transaction — the only state the system has</text>

  <line x1="270" y1="108" x2="270" y2="190" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="282" y="140" font-size="10" opacity="0.75">append rows,</text>
  <text x="282" y="153" font-size="10" opacity="0.75">then exit</text>

  <!-- ROW C : resolve -->
  <rect x="20" y="340" width="130" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="85" y="362" font-size="12.5" text-anchor="middle">cron</text>
  <text x="85" y="378" font-size="10" text-anchor="middle" opacity="0.6">collect.sh</text>

  <rect x="215" y="340" width="160" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="295" y="362" font-size="12.5" text-anchor="middle">resolve_run</text>
  <text x="295" y="378" font-size="10" text-anchor="middle" opacity="0.6">what is still missing?</text>

  <rect x="440" y="340" width="160" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="520" y="362" font-size="12.5" text-anchor="middle">adapter</text>
  <text x="520" y="378" font-size="10" text-anchor="middle" opacity="0.6">the only per-rollup code</text>

  <rect x="665" y="340" width="150" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="740" y="362" font-size="12.5" text-anchor="middle">Ethereum L1</text>
  <text x="740" y="378" font-size="10" text-anchor="middle" opacity="0.6">batch · proof</text>

  <line x1="270" y1="258" x2="270" y2="334" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="282" y="288" font-size="10" opacity="0.75">rows lacking</text>
  <text x="282" y="301" font-size="10" opacity="0.75">t2 or t3</text>

  <line x1="150" y1="365" x2="209" y2="365" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="179" y="358" font-size="10" text-anchor="middle" opacity="0.75">hourly</text>

  <line x1="375" y1="365" x2="434" y2="365" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="600" y1="365" x2="659" y2="365" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="629" y="358" font-size="10" text-anchor="middle" opacity="0.75">read</text>

  <!-- write-back : L1 timestamps return to the file -->
  <path d="M 740 340 L 740 227 L 606 227" fill="none" stroke="#c2410c" stroke-width="1.6"
        marker-end="url(#ar)"/>
  <text x="752" y="286" font-size="10.5" fill="#c2410c">t2 · t3</text>
  <text x="752" y="299" font-size="10.5" fill="#c2410c">written back</text>

  <!-- adapter divergence -->
  <text x="520" y="414" font-size="10" text-anchor="middle" opacity="0.8">ZK rollup → t3 observed (a proof)</text>
  <text x="520" y="431" font-size="10" text-anchor="middle" opacity="0.8">Optimistic → t3 derived (a deadline)</text>

  <!-- ROW D : export -->
  <rect x="215" y="480" width="385" height="52" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="407" y="503" font-size="12.5" text-anchor="middle">export · figures</text>
  <text x="407" y="520" font-size="10" text-anchor="middle" opacity="0.6">latencies and prices applied here, never before</text>

  <line x1="405" y1="258" x2="405" y2="474" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="417" y="292" font-size="10" opacity="0.75">absolute</text>
  <text x="417" y="305" font-size="10" opacity="0.75">timestamps</text>
</svg>
