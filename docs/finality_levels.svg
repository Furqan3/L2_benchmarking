<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"
     aria-label="The three finality levels. A transaction is broadcast at t0, accepted by the sequencer at t1 after about half a minute, included in a batch posted to Ethereum at t2 after two to twenty-five minutes, and becomes trustless at t3 — a verified proof after about 36 minutes on a ZK rollup, or a challenge window closing after seven days on an optimistic one. Each stage removes someone you had to trust."
     font-family="Helvetica, Arial, sans-serif" fill="currentColor">
  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
  </defs>

  <text x="20" y="30" font-size="9.5" letter-spacing="1.6" opacity="0.55">THE LIFE OF ONE TRANSACTION — NOT TO SCALE</text>

  <!-- axis and branches -->
  <line x1="98" y1="230" x2="600" y2="230" stroke="currentColor" stroke-width="2"/>
  <path d="M 600 230 L 600 150 L 668 150" fill="none" stroke="currentColor" stroke-width="2"
        marker-end="url(#f1)"/>
  <path d="M 600 230 L 600 320 L 668 320" fill="none" stroke="#c2410c" stroke-width="2"
        stroke-dasharray="7 4" marker-end="url(#f2)"/>

  <circle cx="110" cy="230" r="7" fill="currentColor"/>
  <circle cx="250" cy="230" r="7" fill="currentColor"/>
  <circle cx="430" cy="230" r="7" fill="currentColor"/>
  <circle cx="678" cy="150" r="7" fill="currentColor"/>
  <circle cx="678" cy="320" r="7" fill="#c2410c"/>

  <!-- stage labels above the axis -->
  <text x="110" y="206" font-size="13" text-anchor="middle" font-weight="bold">t0</text>
  <text x="110" y="190" font-size="10.5" text-anchor="middle">you broadcast</text>

  <text x="250" y="206" font-size="13" text-anchor="middle" font-weight="bold">t1</text>
  <text x="250" y="190" font-size="10.5" text-anchor="middle">the sequencer accepts it</text>
  <text x="250" y="175" font-size="10" text-anchor="middle" opacity="0.7">a receipt appears</text>
  <text x="250" y="154" font-size="11.5" text-anchor="middle" font-weight="bold">26–35 seconds</text>

  <text x="430" y="206" font-size="13" text-anchor="middle" font-weight="bold">t2</text>
  <text x="430" y="190" font-size="10.5" text-anchor="middle">its batch is posted to Ethereum</text>
  <text x="430" y="175" font-size="10" text-anchor="middle" opacity="0.7">the data becomes public</text>
  <text x="430" y="154" font-size="11.5" text-anchor="middle" font-weight="bold">2–25 minutes</text>

  <text x="696" y="130" font-size="13" font-weight="bold">t3 · ZK rollup</text>
  <text x="696" y="147" font-size="10.5">a proof is verified on Ethereum</text>
  <text x="696" y="162" font-size="10" opacity="0.7">a real event, with a transaction hash</text>
  <text x="696" y="182" font-size="11.5" font-weight="bold">36 minutes — OBSERVED</text>

  <text x="696" y="300" font-size="13" font-weight="bold" fill="#c2410c">t3 · optimistic rollup</text>
  <text x="696" y="317" font-size="10.5" fill="#c2410c">the challenge window closes</text>
  <text x="696" y="332" font-size="10" fill="#c2410c" opacity="0.85">nothing happens — a deadline passes</text>
  <text x="696" y="352" font-size="11.5" font-weight="bold" fill="#c2410c">7.01 days — DERIVED</text>

  <!-- trust zones, each spanning exactly the segment it describes -->
  <line x1="110" y1="256" x2="250" y2="256" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="110" y1="252" x2="110" y2="260" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="252" x2="250" y2="260" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <text x="180" y="274" font-size="10" text-anchor="middle" opacity="0.65">not settled at all</text>

  <line x1="250" y1="256" x2="430" y2="256" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="430" y1="252" x2="430" y2="260" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <text x="340" y="276" font-size="10.5" text-anchor="middle" font-weight="bold">FULL TRUST</text>
  <text x="340" y="290" font-size="9.5" text-anchor="middle" opacity="0.75">you are trusting one company's word.</text>
  <text x="340" y="302" font-size="9.5" text-anchor="middle" opacity="0.75">Nothing outside their system proves anything.</text>

  <line x1="430" y1="256" x2="600" y2="256" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="252" x2="600" y2="260" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <text x="515" y="376" font-size="10.5" text-anchor="middle" font-weight="bold">PARTIAL TRUST</text>
  <text x="515" y="390" font-size="9.5" text-anchor="middle" opacity="0.75">the data is public and permanent,</text>
  <text x="515" y="402" font-size="9.5" text-anchor="middle" opacity="0.75">but nobody has checked it yet</text>
  <line x1="515" y1="262" x2="515" y2="362" stroke="currentColor" stroke-width="0.9"
        opacity="0.25" stroke-dasharray="3 3"/>

  <text x="740" y="404" font-size="10.5" text-anchor="middle" font-weight="bold">TRUSTLESS</text>
  <text x="740" y="418" font-size="9.5" text-anchor="middle" opacity="0.75">nobody has to be trusted.</text>
  <text x="740" y="430" font-size="9.5" text-anchor="middle" opacity="0.75">Ethereum itself is now certain.</text>

  <text x="20" y="466" font-size="10.5">Ask "how fast is this rollup?" and the honest answer is 30 seconds, 2 minutes, or 7 days — it depends</text>
  <text x="20" y="482" font-size="10.5">entirely on who you are willing to trust. Most published benchmarks report only t1 and call it latency.</text>
</svg>
