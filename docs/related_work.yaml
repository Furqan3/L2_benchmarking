# The framework comparison table (task H1).
#
# Rows are the benchmarking frameworks this study sits beside. Columns are the
# capabilities that distinguish them. The empty cells in the finality_aware
# column are the contribution - say so explicitly in the surrounding text rather
# than leaving a reader to notice.
#
#     EVERY CELL COMES FROM THE PAPER, NOT FROM MEMORY
#
# Each row carries a `verified` field. It stays false until somebody has opened
# the paper at the DOI recorded here and confirmed the cells against it. Rows
# marked false are rendered with a warning rather than silently presented as
# fact, because a wrong cell in a comparison table is the first thing a reviewer
# checks - and a fabricated one loses their trust in everything else.
#
# Values: yes | no | partial | unknown
#   unknown means nobody has checked yet. It is not a synonym for no.

columns:
  - targets          # L1, L2, or both
  - metrics          # what it measures
  - finality_aware   # does it distinguish levels of settlement?
  - emulation        # can it emulate network conditions?
  - cost             # does it measure monetary cost?
  - reproducible     # are configs/versions pinned and published?
  - code_public      # is the implementation available?

rows:

  - name: Hyperledger Caliper
    verified: false
    citation: >
      R. K. Kaushal and N. Kumar, "Exploring Hyperledger Caliper Benchmarking
      Tool to Measure the Performance of Blockchain Based Solutions," 2024 11th
      International Conference on Reliability, Infocom Technologies and
      Optimization (Trends and Future Directions) (ICRITO), Noida, India, 2024,
      pp. 1-6.
    doi: 10.1109/ICRITO61523.2024.10522188
    note: >
      An APPLICATION of Caliper to a Hyperledger Fabric remote-patient-monitoring
      system, not a paper presenting Caliper itself. Usable as evidence of what
      Caliper measures, but the row describes the framework, so consider citing
      the Hyperledger Foundation's own documentation alongside it, or a source
      that presents the tool directly.
    cells:
      # Provisional, inferred from the title and keywords only - the paper has
      # not been read. Every one of these must be confirmed or corrected.
      targets: L1 (permissioned - Hyperledger Fabric)
      metrics: throughput, latency, resource use
      finality_aware: unknown
      emulation: unknown
      cost: unknown
      reproducible: unknown
      code_public: yes

